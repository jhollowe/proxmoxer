[pylint]
max-line-length = 100
# allow single letter variables
variable-rgx = [a-z0-9_]{1,30}$

[pylint.messages_control]
# let black handle line length
# ignore documentation warning
disable = line-too-long, missing-module-docstring, missing-function-docstring, missing-class-docstring

[flake8]
max-line-length = 100
extend-ignore = E203, E501, F811, E302, E305
exclude = .git,__pycache__,old,build,dist,*.egg-info

[isort]
profile = black
