[tool.ruff]
line-length = 100
exclude = [".git", "__pycache__", "old", "build", "dist", "*.egg-info"]

[tool.ruff.lint]
# https://docs.astral.sh/ruff/rules/
select = [
  "F",
  "T20",
  "PL",
  "I",
]
ignore = [
  "PLR0912", # don't limit code branches
  "PLR0913", # don't limit the number of function arguments
  "PLR2004", # allow magic values
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = [
  "F811" # allow "unused" fixtures in tests (fixtures that only provide side effects)
]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
docstring-code-format = true
docstring-code-line-length = "dynamic"
